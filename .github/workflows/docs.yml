name: docs

# Build the C library reference (Doxygen) and publish it to GitHub Pages.
#
# One-time setup: repo Settings -> Pages -> Build and deployment -> Source: "GitHub Actions".

on:
  push:
    branches: [main]
    paths:
      - 'include/**'
      # the guide pages @include / @snippet these verbatim
      - 'examples/**'
      - 'src/classes/**'
      - 'wrapper/*/README.md'
      - 'doc/**'
      - '.github/workflows/docs.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Allow one concurrent deployment; don't cancel an in-progress publish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Doxygen + Graphviz
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends doxygen graphviz

      # CWD must be doc/: Doxyfile resolves INPUT and the @include paths of the
      # guide pages relative to itself.
      - name: Build C library docs (Doxygen)
        run: doxygen Doxyfile
        working-directory: doc

      - uses: actions/upload-pages-artifact@v3
        with:
          path: doc/html

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
